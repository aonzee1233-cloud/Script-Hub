<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Hub</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mute:#667085; --line:#e3e6eb;
  --accent:#2f6df6; --accent-ink:#fff; --good:#12805c; --warn:#b4540a; --bad:#c0362c; --chip:#eef1f6; --star:#d99a00;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#171a21;--ink:#e9ecf1;--mute:#8d96a5;--line:#262b35;--accent:#6b9bff;--accent-ink:#0b1020;--good:#3ecf9c;--warn:#f0a15a;--bad:#ff7b70;--chip:#1f232c;--star:#f5c542}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:8px;min-width:0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;max-width:min(240px,50vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip.icon{flex:none;width:40px;padding:8px 0;text-align:center;font-size:17px;line-height:1.3}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:12px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
label.btn{display:inline-flex;align-items:center;justify-content:center;position:relative}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.name{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.msg{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 2px}
.ver{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ver:last-child{border-bottom:0}
.ver .info{flex:1;min-width:0}
.ver .t{font-size:13px;color:var(--mute)}
.ver .m{font-size:15px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--good);margin-left:6px}
.badge.warn{color:var(--warn)}
.sha{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);color:var(--mute);font-size:14px;margin-bottom:12px;overflow-wrap:anywhere}
.note.err{color:var(--bad)} .note.warn{color:var(--warn)}
.note .row{margin-top:8px}
.form{display:grid;gap:10px}
input[type=text],input[type=search],input[type=password]{-webkit-appearance:none;appearance:none;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px}
textarea.field{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px 14px;resize:vertical}
details{margin-top:18px;color:var(--mute);font-size:14px}
summary{cursor:pointer;min-height:36px}
details ol{padding-left:20px;margin:6px 0}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;text-align:center;bottom:28px;transform:translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
#toast.on{opacity:1;transform:translateY(0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet>div{background:var(--card);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:10px;align-content:start}
.sheet textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px}
.steps{margin:0;padding-left:20px;color:var(--mute);font-size:14px}
.steps li{margin:3px 0}
.steps a{color:var(--accent);overflow-wrap:anywhere}

/* toolbar */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 10px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;font:inherit;font-size:13px;min-height:36px;padding:0 12px;cursor:pointer}

/* list */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13px;font-weight:650;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.line{display:flex;align-items:center;gap:2px;padding:6px 10px 6px 0}
.star{appearance:none;border:0;background:none;width:46px;height:46px;flex:none;font-size:24px;line-height:1;color:var(--mute);cursor:pointer;border-radius:12px}
.star.on{color:var(--star)}
.main{flex:1;min-width:0;padding:4px 6px 4px 0;cursor:pointer}
.main .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.pv{color:var(--accent)}
.detail{padding:12px 14px 14px;background:var(--bg);border-top:1px solid var(--line)}
.full{font-weight:650;overflow-wrap:anywhere}
.more{width:100%;margin-top:12px}

/* messages */
.notes{margin-top:14px;border-top:1px solid var(--line);padding-top:4px;display:grid;gap:8px}
.nt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ntx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ntm{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:2px}
.ntb{display:flex;align-items:center}
.link{appearance:none;border:0;background:none;color:var(--bad);font:inherit;font-size:13px;padding:8px 0 8px 14px;cursor:pointer}
.link.cp{color:var(--accent)}
.l0{padding:6px 0 2px}

/* tags, sort, select, editor */
.pill.hi{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.pill.on{color:var(--accent);border-color:var(--accent)}
select.pill{padding:0 10px}
.tagbar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none}
.tagbar::-webkit-scrollbar{display:none}
.tagbar:empty{display:none}
.tagbar .pill{flex:none}
.tg{display:inline-block;font:inherit;font-size:12px;line-height:1.6;padding:0 8px;margin:2px 4px 2px 0;border:0;border-radius:999px;background:hsl(var(--h) 70% 50% / .16);color:hsl(var(--h) 70% 34%);white-space:nowrap}
button.tg{cursor:pointer;padding:3px 10px}
.pill.tgp{background:hsl(var(--h) 70% 50% / .13);color:hsl(var(--h) 70% 34%);border-color:transparent}
.pill.tgp.on{background:hsl(var(--h) 65% 42%);color:#fff}
@media (prefers-color-scheme: dark){
  .tg,.pill.tgp{color:hsl(var(--h) 85% 76%)}
  .pill.tgp.on{background:hsl(var(--h) 55% 38%);color:#fff}
}
.new{display:inline-block;font-size:11px;font-weight:650;line-height:1.5;padding:0 7px;margin-right:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.star.chk{font-size:22px}
.star.chk.on{color:var(--accent)}
.tgrow{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 2px}
.tinp{display:flex;gap:8px;margin-top:6px}
.tinp input{flex:1;min-width:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{max-width:720px;margin:0 auto;display:grid;gap:6px}
.bar .row{margin-top:0;flex-wrap:nowrap}
.bar .btn{flex:1;padding:0 6px}
body.sel #toast{bottom:124px}
body.sel main{padding-bottom:150px}
textarea.code{min-height:240px;white-space:pre;overflow:auto;font:13px/1.4 ui-monospace,Menlo,monospace;tab-size:2}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);min-height:40px}
.chk input{width:20px;height:20px}

/* upload sheet */
.pick{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pick .info{flex:1;min-width:0;overflow-wrap:anywhere}
.sz{color:var(--mute);font-size:12px}

/* v13: เรียบขึ้น */
.search .btn.ic{width:48px;padding:0;font-size:22px;line-height:1;flex:none}
.tools:empty{display:none}
.sort{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sort .btn{padding:0 4px;font-size:14px}
.sort .btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.link.rm{padding-left:0;margin-left:auto}

/* v14: iOS minimal */
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--mute:#6e6e73;--line:rgba(60,60,67,.16);--accent:#007aff;--accent-ink:#fff;--good:#248a3d;--warn:#c93400;--bad:#ff3b30;--chip:rgba(120,120,128,.12);--star:#ff9f0a;--fill:rgba(120,120,128,.12);--glass:rgba(242,242,247,.72)}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--mute:#98989f;--line:rgba(84,84,88,.55);--accent:#0a84ff;--accent-ink:#fff;--good:#30d158;--warn:#ff9f0a;--bad:#ff453a;--chip:rgba(120,120,128,.24);--star:#ff9f0a;--fill:rgba(120,120,128,.24);--glass:rgba(0,0,0,.62)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideup{from{transform:translateY(calc(100% + 24px))}to{transform:none}}
@keyframes slidedown{to{transform:translateY(calc(100% + 24px))}}
body{font-family:-apple-system,"SF Pro Text",system-ui,"Noto Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}
header{animation:rise .6s cubic-bezier(.16,1,.3,1) both;margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
.chip{border:0;background:var(--fill);color:var(--accent);font-weight:500}
.chip.icon{color:var(--ink)}
.btn,.pill,.chip,.star{transition:transform .3s cubic-bezier(.3,1.5,.5,1),background .2s,opacity .2s}
.btn:active,.pill:active,.chip:active,.star:active{transform:scale(.93)}
.btn{border:0;background:var(--fill);color:var(--accent);border-radius:999px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--fill);color:var(--bad)}
.btn.more{background:none}
.top{margin:0 -16px;padding:8px 16px 10px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.search .btn.ic{width:44px;height:44px;font-weight:400}
.search .btn.ic:not(.primary){background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 1px 8px rgba(0,0,0,.1),inset 0 0 0 .5px rgba(255,255,255,.4);color:var(--ink)}
input[type=text],input[type=search],input[type=password]{border:0;background:var(--fill);border-radius:999px;min-height:44px;padding:0 18px;transition:box-shadow .25s}
.form input[type=text],.form input[type=password],.sheet input[type=text],.sheet input[type=password]{border-radius:14px}
input:focus,textarea:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
textarea.field,.sheet textarea{border:0;background:var(--fill);border-radius:16px}
.pill{border:0;background:var(--fill);color:var(--mute);font-weight:500}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.sec{margin:22px 16px 8px;font-weight:600}
.list{border:0;border-radius:20px}
.item{border-bottom:0}
.line{position:relative;transition:background .2s}
.line:active{background:var(--fill)}
.item+.item>.line::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--line)}
.name{font-weight:600}
.new{background:var(--accent)}
.detail{background:rgba(120,120,128,.06);border-top:0;animation:rise .3s cubic-bezier(.16,1,.3,1) both}
.note,.nt{border:0;border-radius:18px}
.nt{background:var(--fill)}
.enter .item{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
.enter .item:nth-child(n+2){animation-delay:.04s}.enter .item:nth-child(n+3){animation-delay:.08s}.enter .item:nth-child(n+4){animation-delay:.12s}.enter .item:nth-child(n+5){animation-delay:.16s}.enter .item:nth-child(n+6){animation-delay:.2s}.enter .item:nth-child(n+8){animation-delay:.25s}
.enter .sec{animation:fade .5s both}
.sheet{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .3s both}
.sheet>div{position:relative;width:calc(100% - 16px);max-height:88vh;margin:0 auto calc(8px + env(safe-area-inset-bottom));padding:26px 16px 16px;border-radius:32px;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);animation:slideup .55s cubic-bezier(.16,1,.3,1) both}
.sheet>div::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sheet.out{pointer-events:none;animation:fadeout .22s both}
.sheet.out>div{animation:slidedown .24s cubic-bezier(.5,0,.75,0) both}
.bar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--line)}
#toast{background:color-mix(in srgb,var(--ink) 84%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:999px;padding:11px 20px;transform:translateY(24px) scale(.94);transition:opacity .3s,transform .5s cubic-bezier(.3,1.4,.5,1)}
#toast.on{transform:none}
summary{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Script Hub</h1>
    <div class="hr">
      <button id="repoBtn" class="chip" hidden></button>
      <button id="cfgBtn" class="chip icon" aria-label="ตั้งค่า token">⚙</button>
    </div>
  </header>
  <div id="status"></div>
  <div id="app"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

var PAGE = 30;                    // แสดงทีละกี่ไฟล์
var DATA_PATH = '.hub-data.json'; // ไฟล์เก็บดาว + ข้อความ (อยู่ใน repo)
var MAX_BYTES = 5 * 1024 * 1024;  // อัพได้ไฟล์ละไม่เกิน 5 MB
var NEW_MS = 24 * 60 * 60 * 1000; // แก้ภายในกี่ ms ถึงขึ้นป้าย "ใหม่"

/* ---------- helpers ---------- */
var store = {
  get: function (k) { try { return JSON.parse(localStorage.getItem('hub:' + k)); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem('hub:' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('hub:' + k); } catch (e) {} }
};

function h(tag, props) {
  var el = document.createElement(tag);
  var p = props || {};
  Object.keys(p).forEach(function (k) {
    var v = p[k];
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  });
  var kids = [].concat.apply([], [].slice.call(arguments, 2));
  kids.forEach(function (kid) {
    if (kid == null || kid === false) return;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return el;
}

var enc = function (path) { return path.split('/').map(encodeURIComponent).join('/'); };
var rawUrl = function (ref, path) { return 'https://raw.githubusercontent.com/' + S.repo + '/' + encodeURIComponent(ref) + '/' + enc(path); };
var deltaLine = function (url) { return 'loadstring(game:HttpGet("' + url + '"))()'; };
var isGood = function (m) { return /stable|เสถียร|✅|⭐/i.test(m || ''); };

var DATE = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
var TIME = new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit' });
function when(iso) { return DATE.format(new Date(iso)); }
function ago(iso) {
  var s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return 'เมื่อกี้';
  var m = s / 60; if (m < 60) return Math.round(m) + ' นาทีก่อน';
  var hr = m / 60; if (hr < 24) return Math.round(hr) + ' ชม.ก่อน';
  var d = hr / 24; if (d < 30) return Math.round(d) + ' วันก่อน';
  var mo = d / 30; if (mo < 12) return Math.round(mo) + ' เดือนก่อน';
  return Math.round(d / 365) + ' ปีก่อน';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
function cleanTag(s) { return String(s || '').replace(/^#+/, '').replace(/\s+/g, ' ').trim().slice(0, 24); }
function hue(s) { var x = 0, i; for (i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 360; return x; }
function stripFence(t) { var m = /^\s*```[^\n]*\n([\s\S]*?)\n?```\s*$/.exec(t || ''); return m ? m[1] : t; }
function asObj(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }

function bufB64(buf) {
  var b = new Uint8Array(buf), s = '', i;
  for (i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function toB64(str) { return bufB64(new TextEncoder().encode(str)); }
function fromB64(b64) {
  var s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length), i;
  for (i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function readFile(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(r.result); };
    r.onerror = function () { rej(new Error('read')); };
    r.readAsArrayBuffer(file);
  });
}

/* ---------- state ---------- */
var S = {
  repo: null, branch: null, files: [], showAll: false, open: {}, hopen: {}, phase: 'form', error: null, limit: null,
  progress: '', truncated: false,
  token: store.get('token') || null, tokenBad: false,
  q: '', shown: PAGE, dataFail: false, saveFailed: false,
  sort: ({ date: 1, name: 1, used: 1 })[store.get('sort')] ? store.get('sort') : 'date',
  tag: '', selMode: false, sel: {}
};
var D = norm(null);      // ดาว + ข้อความ  { stars:{path:iso}, notes:{path:[{id,t,text}]} }
var dataSha = null;      // sha ของ .hub-data.json บน GitHub
var pending = [];        // การแก้ที่ยังไม่ได้บันทึกขึ้น GitHub
var app = document.getElementById('app');
var repoBtn = document.getElementById('repoBtn');
var cfgBtn = document.getElementById('cfgBtn');
var statusBox = document.getElementById('status');
var listBox = null;
var tagBox = null, toolsBox = null, barBox = null, tagList = null;
var U = {};              // ใช้ล่าสุด { path: iso } เก็บเฉพาะเครื่องนี้

function parseRepo(text) {
  var t = (text || '').trim()
    .replace(/^https?:\/\//i, '')
    .replace(/^(www\.)?(raw\.githubusercontent\.com|github\.com)\//i, '')
    .replace(/\.git$/, '');
  var parts = t.split(/[\/?#]/).filter(Boolean);
  return parts.length >= 2 ? parts[0] + '/' + parts[1] : null;
}

function detectRepo() {
  var q = parseRepo(new URLSearchParams(location.search).get('repo'));
  if (q) return q;
  var hs = parseRepo(location.hash.replace('#', ''));
  if (hs) return hs;
  if (/\.github\.io$/i.test(location.hostname)) {
    var owner = location.hostname.split('.')[0];
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg && !/\.html?$/i.test(seg)) return owner + '/' + seg;
  }
  return store.get('repo');
}

/* ---------- GitHub API ---------- */
function ApiError(kind, extra) { this.kind = kind; for (var k in (extra || {})) this[k] = extra[k]; }

// opt: { method, body, token }  ถ้ามี token ที่ใช้ได้จะแนบไปด้วย (ได้โควต้าเช็กเยอะขึ้น + เขียนได้)
function api(path, opt) {
  opt = opt || {};
  var method = opt.method || 'GET';
  var tok = opt.token || (S.token && !S.tokenBad ? S.token : null);
  var headers = { 'Accept': 'application/vnd.github+json' };
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  if (opt.body) headers['Content-Type'] = 'application/json';
  return fetch('https://api.github.com' + path, { method: method, headers: headers, body: opt.body ? JSON.stringify(opt.body) : undefined })
    .catch(function () { throw new ApiError('network'); })
    .then(function (r) {
      if (r.ok) return r.status === 204 ? null : r.json();
      return r.json().catch(function () { return {}; }).then(function (b) {
        var msg = (b && b.message) || '';
        if (r.status === 401) {
          if (tok && !opt.token) {
            S.tokenBad = true; renderStatus();
            if (method === 'GET') return api(path, opt); // token เสีย: อ่านต่อแบบไม่ใช้ token
          }
          throw new ApiError('auth', { msg: msg });
        }
        if (r.status === 404) throw new ApiError('notfound', { msg: msg });
        if (r.status === 403 || r.status === 429) {
          var rem = r.headers.get('x-ratelimit-remaining');
          var reset = Number(r.headers.get('x-ratelimit-reset')) * 1000;
          if (rem === '0' || r.status === 429) throw new ApiError('limit', { reset: reset || null });
          throw new ApiError('forbidden', { msg: msg });
        }
        if (r.status === 409 || (r.status === 422 && /sha|does not match/i.test(msg))) throw new ApiError('conflict', { msg: msg });
        throw new ApiError('http', { status: r.status, msg: msg });
      });
    });
}

// คิวเขียน: งานเขียนขึ้น GitHub ทำทีละงาน ไม่ซ้อนกัน
var wq = Promise.resolve();
function serial(task) { var p = wq.then(task); wq = p.then(function () {}, function () {}); return p; }

function visible() {
  return S.files.filter(function (f) {
    if (f.path === 'index.html') return false;
    if (f.path.split('/').some(function (s) { return s.charAt(0) === '.'; })) return false;
    return S.showAll || /\.(lua|luau|txt)$/i.test(f.path);
  });
}

function loadAll() {
  S.phase = 'loading'; S.error = null; S.limit = null; S.progress = ''; S.dataFail = false; S.selMode = false; S.sel = {}; render();
  api('/repos/' + S.repo)
    .then(function (meta) {
      S.branch = meta.default_branch;
      return api('/repos/' + S.repo + '/git/trees/' + encodeURIComponent(S.branch) + '?recursive=1');
    })
    .then(function (tree) {
      S.truncated = !!tree.truncated;
      var cache = store.get('c:' + S.repo) || {};
      S.files = tree.tree.filter(function (t) { return t.type === 'blob'; }).map(function (t) {
        var c = cache[t.path];
        return { path: t.path, sha: t.sha, commits: c && c.sha === t.sha ? c.commits : null };
      });
      return fill();
    })
    .then(function () { return loadData(); })
    .then(function () { S.phase = 'ready'; render(); })
    .catch(function (e) { S.phase = 'error'; S.error = e; render(); });
}

function fill() {
  var todo = visible().filter(function (f) { return !f.commits; });
  var i = 0, done = 0;
  var cache = store.get('c:' + S.repo) || {};
  function tick() {
    S.progress = todo.length ? 'เช็กวันที่แก้ไข ' + done + '/' + todo.length : '';
    var el = document.getElementById('prog'); if (el) el.textContent = S.progress;
  }
  tick();
  function worker() {
    if (i >= todo.length || S.limit) return Promise.resolve();
    var f = todo[i++];
    return api('/repos/' + S.repo + '/commits?sha=' + encodeURIComponent(S.branch) + '&path=' + encodeURIComponent(f.path) + '&per_page=15')
      .then(function (arr) {
        f.commits = arr.map(function (c) {
          var who = c.commit.committer || c.commit.author;
          return { sha: c.sha, date: who.date, msg: (c.commit.message || '').split('\n')[0] };
        });
        cache[f.path] = { sha: f.sha, commits: f.commits };
      })
      .catch(function (e) { if (e.kind === 'limit') S.limit = e; })
      .then(function () { done++; tick(); return worker(); });
  }
  return Promise.all([worker(), worker(), worker(), worker()]).then(function () {
    var keep = {};
    S.files.forEach(function (f) { if (cache[f.path]) keep[f.path] = cache[f.path]; });
    store.set('c:' + S.repo, keep);
  });
}

function cacheFile(f) {
  if (!f.commits) return;
  var cache = store.get('c:' + S.repo) || {};
  cache[f.path] = { sha: f.sha, commits: f.commits };
  store.set('c:' + S.repo, cache);
}

/* ---------- ดาว + ข้อความ (เก็บใน .hub-data.json ของ repo) ---------- */
function norm(d) {
  if (!d || typeof d !== 'object') d = {};
  d.v = 1;
  if (!d.stars || typeof d.stars !== 'object') d.stars = {};
  if (!d.notes || typeof d.notes !== 'object') d.notes = {};
  if (!d.tags || typeof d.tags !== 'object' || Array.isArray(d.tags)) d.tags = {};
  if (!d.stable || typeof d.stable !== 'object' || Array.isArray(d.stable)) d.stable = {};
  if (!Array.isArray(d.trash)) d.trash = [];
  return d;
}

function initData() {
  D = norm(store.get('d:' + S.repo)); dataSha = null; pending = [];
  U = asObj(store.get('u:' + S.repo));
  S.dataFail = false; S.saveFailed = false;
}

function fetchData() {
  var url = '/repos/' + S.repo + '/contents/' + enc(DATA_PATH) + '?ref=' + encodeURIComponent(S.branch) + '&_=' + Date.now();
  return api(url).then(function (r) {
    var d = null;
    try { d = JSON.parse(fromB64(r.content)); } catch (e) {}
    return { sha: r.sha, data: norm(d) };
  }, function (e) {
    if (e.kind === 'notfound') return { sha: null, data: norm(null) };
    throw e;
  });
}

function loadData() {
  return fetchData().then(function (r) {
    D = r.data; dataSha = r.sha;
    pending.forEach(function (fn) { fn(D); });
    store.set('d:' + S.repo, D);
  }, function () { S.dataFail = true; });
}

// การแก้แต่ละแบบเป็นฟังก์ชันที่รันซ้ำได้ ถ้าชนกับเครื่องอื่นจะดึงของใหม่แล้วรันซ้ำให้
function setStar(path, on) { return function (d) { if (on) d.stars[path] = d.stars[path] || new Date().toISOString(); else delete d.stars[path]; }; }
function addNote(path, note) {
  return function (d) {
    var a = d.notes[path] || (d.notes[path] = []);
    if (!a.some(function (x) { return x.id === note.id; })) a.push(note);
  };
}
function delNote(path, id) {
  return function (d) {
    var a = d.notes[path]; if (!a) return;
    d.notes[path] = a.filter(function (x) { return x.id !== id; });
    if (!d.notes[path].length) delete d.notes[path];
  };
}
function isStable(c) { return D.stable[c.sha] != null ? !!D.stable[c.sha] : isGood(c.msg); }
function setStable(sha, on) { return function (d) { d.stable[sha] = !!on; }; }
function addTag(path, tag) {
  return function (d) {
    var a = d.tags[path] || (d.tags[path] = []);
    if (a.indexOf(tag) === -1) a.push(tag);
  };
}
function delTag(path, tag) {
  return function (d) {
    var a = d.tags[path]; if (!a) return;
    d.tags[path] = a.filter(function (x) { return x !== tag; });
    if (!d.tags[path].length) delete d.tags[path];
  };
}
function setTags(path, arr) { return function (d) { if (arr.length) d.tags[path] = arr.slice(); else delete d.tags[path]; }; }
// ลบไฟล์ = ย้ายเข้าถังขยะ (เก็บ sha ของเนื้อไฟล์ไว้ กู้คืนจากประวัติ git ได้) พร้อมดาว/ข้อความ/แท็กเดิม
function trashFile(e) {
  return function (d) {
    if (!d.trash.some(function (x) { return x.id === e.id; })) d.trash.unshift(e);
    if (d.trash.length > 100) d.trash.length = 100;
    delete d.stars[e.path]; delete d.notes[e.path]; delete d.tags[e.path];
  };
}
function untrash(e) {
  return function (d) {
    d.trash = d.trash.filter(function (x) { return x.id !== e.id; });
    if (e.star && !d.stars[e.path]) d.stars[e.path] = e.star;
    (e.notes || []).forEach(function (n) { addNote(e.path, n)(d); });
    (e.tags || []).forEach(function (t) { addTag(e.path, t)(d); });
  };
}
function dropTrash(id) { return function (d) { d.trash = d.trash.filter(function (x) { return x.id !== id; }); }; }
function mergeData(imp) {
  return function (d) {
    var st = asObj(imp.stars), nt = asObj(imp.notes), tg = asObj(imp.tags), sb = asObj(imp.stable);
    Object.keys(st).forEach(function (p) { if (!d.stars[p]) d.stars[p] = typeof st[p] === 'string' ? st[p] : new Date().toISOString(); });
    Object.keys(nt).forEach(function (p) {
      (Array.isArray(nt[p]) ? nt[p] : []).forEach(function (n) {
        if (n && n.id && typeof n.text === 'string') addNote(p, { id: String(n.id), t: n.t || new Date().toISOString(), text: n.text })(d);
      });
    });
    Object.keys(tg).forEach(function (p) {
      (Array.isArray(tg[p]) ? tg[p] : []).forEach(function (t) { t = cleanTag(t); if (t) addTag(p, t)(d); });
    });
    Object.keys(sb).forEach(function (s) { if (d.stable[s] == null) d.stable[s] = !!sb[s]; });
    (Array.isArray(imp.trash) ? imp.trash : []).forEach(function (e) {
      if (e && e.id && e.path && e.sha && !d.trash.some(function (x) { return x.id === e.id; })) d.trash.push(e);
    });
  };
}

var saveTimer, saving = false, dirty = false, tries = 0;

function mutate(fn) {
  fn(D); pending.push(fn);
  store.set('d:' + S.repo, D);
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}

function flush() {
  if (saving) { dirty = true; return; }
  if (!pending.length) return;
  saving = true; dirty = false;
  var n = pending.length;
  var body = { message: 'hub: อัพเดตดาว/ข้อความ', content: toB64(JSON.stringify(D)), branch: S.branch };
  if (dataSha) body.sha = dataSha;
  serial(function () { return api('/repos/' + S.repo + '/contents/' + enc(DATA_PATH), { method: 'PUT', body: body }); })
    .then(function (res) {
      dataSha = res.content.sha; pending.splice(0, n); tries = 0; S.saveFailed = false;
      toast('บันทึกแล้ว ✓');
    })
    .catch(function (e) {
      if (e.kind === 'conflict' && tries < 3) {
        tries++;
        return fetchData().then(function (r) {
          D = r.data; dataSha = r.sha;
          pending.forEach(function (fn) { fn(D); });
          store.set('d:' + S.repo, D);
          dirty = true;
          if (listBox) renderList();
        });
      }
      throw e;
    })
    .catch(function (e) { tries = 0; S.saveFailed = true; toast(writeError(e), 3500); })
    .then(function () { saving = false; renderStatus(); if (dirty) flush(); });
}

/* ---------- เขียนไฟล์ขึ้น GitHub: อัพ / ลบ ---------- */
function canWrite() { return !!(S.token && !S.tokenBad); }

function guard() {
  if (canWrite()) return true;
  toast(S.token ? 'token ใช้ไม่ได้แล้ว ตั้งใหม่ก่อน' : 'ต้องตั้ง token ก่อน (ครั้งเดียวต่อเครื่อง)', 2400);
  tokenSheet();
  return false;
}

function writeError(e) {
  if (!e) return 'ทำไม่สำเร็จ';
  if (e.kind === 'auth') return 'token ใช้ไม่ได้ (หมดอายุหรือถูกยกเลิก) ตั้งใหม่ที่ปุ่ม ⚙';
  if (e.kind === 'forbidden') return 'token ไม่มีสิทธิ์เขียน ต้องตั้ง Contents เป็น Read and write';
  if (e.kind === 'notfound') return 'หา repo ไม่เจอ หรือ token ไม่มีสิทธิ์กับ repo นี้';
  if (e.kind === 'conflict') return 'ไฟล์เปลี่ยนไประหว่างทาง กดรีเฟรชแล้วลองใหม่';
  return errorText(e);
}

function applyUpload(path, res, message) {
  var who = res.commit.committer || res.commit.author;
  var c = { sha: res.commit.sha, date: who.date, msg: message.split('\n')[0] };
  var f = S.files.filter(function (x) { return x.path === path; })[0];
  if (!f) { f = { path: path, sha: res.content.sha, commits: [c] }; S.files.push(f); }
  else { f.sha = res.content.sha; f.commits = f.commits ? [c].concat(f.commits).slice(0, 15) : null; }
  cacheFile(f);
}

function uploadOne(path, file, message) {
  return readFile(file).then(function (buf) {
    var ex = S.files.filter(function (x) { return x.path === path; })[0];
    var body = { message: message, content: bufB64(buf), branch: S.branch };
    if (ex) body.sha = ex.sha;
    return serial(function () { return api('/repos/' + S.repo + '/contents/' + enc(path), { method: 'PUT', body: body }); });
  }).then(function (res) { applyUpload(path, res, message); });
}

// ลบไฟล์ออกจาก repo แล้วย้ายเข้าถังขยะ (ใช้ทั้งลบทีละไฟล์และลบหลายไฟล์)
function removeFile(f) {
  var entry = { id: uid(), path: f.path, sha: f.sha, t: new Date().toISOString(), star: D.stars[f.path] || null, notes: D.notes[f.path] || [], tags: D.tags[f.path] || [] };
  return serial(function () {
    return api('/repos/' + S.repo + '/contents/' + enc(f.path), { method: 'DELETE', body: { message: 'ลบ ' + f.path, sha: f.sha, branch: S.branch } });
  }).then(function () {
    S.files = S.files.filter(function (x) { return x.path !== f.path; });
    delete S.open[f.path]; delete S.hopen[f.path]; delete S.sel[f.path];
    var cache = store.get('c:' + S.repo) || {}; delete cache[f.path]; store.set('c:' + S.repo, cache);
    mutate(trashFile(entry));
  });
}

function delFile(f) {
  if (!guard()) return;
  ask('ลบ ' + f.path + ' ?',
    'ไฟล์จะย้ายไปถังขยะ (กู้คืนได้ที่ เพิ่มเติม › ถังขยะ พร้อมดาว/ข้อความ/แท็กเดิม) บรรทัด Delta ที่ชี้ไปไฟล์นี้จะโหลดไม่ได้จนกว่าจะกู้คืน ยกเว้นบรรทัดแบบล็อกเวอร์ชันที่คัดลอกจากหน้าประวัติ',
    'ลบเลย', true).then(function (ok) {
    if (!ok) return;
    toast('กำลังลบ…');
    removeFile(f).then(function () {
      toast('ลบแล้ว ✓ กู้คืนได้ในถังขยะ', 2400); renderList();
    }, function (e) { toast(writeError(e), 3500); });
  });
}

/* ---------- copy ---------- */
var toastTimer;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, ms || 1600);
}

function openSheet(build, onDismiss) {
  var panel = h('div', {});
  var sheet = h('div', { class: 'sheet', onclick: function (e) { if (e.target === sheet) { close(); if (onDismiss) onDismiss(); } } }, panel);
  function close() { if (sheet.classList.contains('out')) return; sheet.classList.add('out'); setTimeout(function () { sheet.remove(); }, 230); }
  build(panel, close);
  document.body.append(sheet);
  return close;
}

function showSheet(text) {
  var ta = h('textarea', { readonly: true }); ta.value = text;
  openSheet(function (p, close) {
    p.append(
      h('div', { class: 'hint' }, 'คัดลอกอัตโนมัติไม่ได้ กดค้างที่กล่องแล้วเลือก Copy เอง'),
      ta,
      h('button', { class: 'btn', onclick: close }, 'ปิด'));
  });
  ta.focus(); ta.select();
}

function ask(title, body, okLabel, danger) {
  return new Promise(function (resolve) {
    openSheet(function (p, close) {
      p.append(
        h('div', { class: 'name' }, title),
        h('div', { class: 'meta' }, body),
        h('div', { class: 'row' },
          h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: function () { close(); resolve(true); } }, okLabel),
          h('button', { class: 'btn', onclick: function () { close(); resolve(false); } }, 'ยกเลิก')));
    }, function () { resolve(false); });
  });
}

function copyText(text) {
  var fallback = function () {
    try {
      var ta = h('textarea', { readonly: true }); ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.append(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy'); ta.remove();
      if (ok) { toast('คัดลอกแล้ว ✓'); return; }
    } catch (e) {}
    showSheet(text);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('คัดลอกแล้ว ✓'); }, fallback);
  } else fallback();
}

/* ---------- prompts for Claude ---------- */
function rules(existing) {

    '- ส่งไฟล์เต็มที่รันได้เลย ไม่ใช่เศษโค้ด' + (existing ? ' และใช้ชื่อไฟล์เดิม' : '') + '\n' +

    '- ตอนเริ่มรัน ให้ print("[ชื่อ vX.Y]") หนึ่งครั้ง จะได้รู้ว่ารันเวอร์ชันไหน\n' +

function claudePrompt(f) {

/* ---------- views ---------- */
function note(text, cls) { return h('div', { class: 'note ' + (cls || '') }, text); }

function formView(msg) {
  var input = h('input', { type: 'text', placeholder: 'ชื่อ/repo เช่น somchai/my-scripts หรือวางลิงก์ GitHub', value: S.repo || '', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  var go = function () {
    var r = parseRepo(input.value);
    if (!r) { toast('ใส่ให้ครบ: ชื่อผู้ใช้/ชื่อ repo'); return; }
    S.repo = r; store.set('repo', r); S.files = []; S.open = {}; S.hopen = {}; S.q = ''; S.shown = PAGE; S.tag = ''; S.sel = {}; S.selMode = false;
    initData(); loadAll();
  };
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  return h('div', { class: 'form' },
    msg ? note(msg, 'err') : null,
    note('ใส่ชื่อ repo GitHub ที่เก็บสคริปต์ (ต้องเป็น Public) ใส่ครั้งเดียว เครื่องนี้จะจำไว้'),
    input,
    h('button', { class: 'btn primary', onclick: go }, 'เปิด'));
}

function errorText(e) {
  if (!e) return 'เกิดข้อผิดพลาด';
  if (e.kind === 'notfound') return 'หา repo ' + S.repo + ' ไม่เจอ ตรวจชื่ออีกครั้ง และ repo ต้องเป็น Public (ไม่งั้นลิงก์ raw ก็โหลดใน Delta ไม่ได้)';
  if (e.kind === 'limit') return 'GitHub จำกัดจำนวนครั้งที่เช็กต่อชั่วโมง' + (e.reset ? ' ลองใหม่หลัง ' + TIME.format(new Date(e.reset)) : ' รอสักพักแล้วลองใหม่');
  if (e.kind === 'network') return 'ต่อ GitHub ไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่';
  if (e.kind === 'forbidden') return 'GitHub ไม่อนุญาตคำขอนี้ (403)' + (e.msg ? ': ' + e.msg : '');
  return 'GitHub ตอบกลับผิดปกติ (รหัส ' + (e.status || '?') + ')' + (e.msg ? ': ' + e.msg : '');
}

function byDate(a, b) {
  var da = a.commits && a.commits[0] ? a.commits[0].date : '';
  var db = b.commits && b.commits[0] ? b.commits[0].date : '';
  if (da === db) return a.path.localeCompare(b.path);
  return da < db ? 1 : -1;
}

/* สร้าง/แก้สคริปต์ในหน้านี้ (f = ไฟล์เดิม, null = สร้างใหม่) */
function normPath(s) {
  var p = cleanDir(s);
  if (!p) return '';
  if (p.split('/').some(function (x) { return x.charAt(0) === '.'; })) return null;
  if (p.split('/').pop().indexOf('.') === -1) p += '.lua';
  return p;
}

function editSheet(f) {
  if (!guard()) return;
  openSheet(function (p, close) {
    var isNew = !f, original = null;
    var name = h('input', { type: 'text', placeholder: 'ชื่อไฟล์ เช่น AutoFish.lua หรือ fish/AutoFish.lua', value: isNew ? '' : f.path, readonly: !isNew, autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
    var ta = h('textarea', { class: 'code', placeholder: 'วางโค้ดที่นี่', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', wrap: 'off', oninput: update });
    var cm = h('input', { type: 'text', placeholder: 'ข้อความ commit (วางบรรทัดที่ Claude ให้มาได้ เว้นว่างก็ได้)', autocomplete: 'off' });
    var good = h('input', { type: 'checkbox' });
    var info = h('div', { class: 'hint' });
    var status = h('div', { class: 'hint' });
    var go = h('button', { class: 'btn primary', onclick: save }, 'บันทึกขึ้น GitHub');

    function update() {
      var t = ta.value;
      info.textContent = ta.disabled || !t ? '' : t.split('\n').length + ' บรรทัด · ' + fmtSize(new Blob([t]).size);
      go.disabled = ta.disabled || !t.trim();
    }

    function pasteClip() {
      if (ta.disabled) return;
      if (!navigator.clipboard || !navigator.clipboard.readText) { toast('เครื่องนี้วางอัตโนมัติไม่ได้ กดค้างที่กล่องโค้ดแล้วเลือกวางเอง', 3000); ta.focus(); return; }
      navigator.clipboard.readText().then(function (t) {
        if (!t) { toast('คลิปบอร์ดว่าง'); return; }
        ta.value = stripFence(t); update(); toast('วางแล้ว ✓');
      }, function () { toast('อ่านคลิปบอร์ดไม่ได้ กดค้างที่กล่องโค้ดแล้วเลือกวางเอง', 3000); ta.focus(); });
    }

    function save() {
      var path = isNew ? normPath(name.value) : f.path;
      if (!path) { toast(path === null ? 'ชื่อไฟล์ใช้ไม่ได้ (ห้ามขึ้นต้นด้วยจุด)' : 'ตั้งชื่อไฟล์ก่อน', 2600); return; }
      if (path === 'index.html') { toast('ไม่อนุญาตให้ทับ index.html (ตัวหน้านี้) จากในหน้านี้', 3000); return; }
      var text = stripFence(ta.value);
      if (!text.trim()) { toast('ยังไม่มีโค้ด'); return; }
      if (!isNew && original != null && text === original.replace(/\r\n/g, '\n')) { toast('โค้ดยังไม่เปลี่ยน'); return; }
      if (new Blob([text]).size > MAX_BYTES) { toast('ไฟล์ใหญ่เกิน ' + fmtSize(MAX_BYTES), 3000); return; }
      var exists = fileExists(path);
      if (isNew && exists) {
        ask('มีไฟล์ ' + path + ' อยู่แล้ว', 'จะบันทึกทับเป็นเวอร์ชันใหม่ของไฟล์นั้น (ประวัติเก่ายังอยู่)', 'ทับเลย', false)
          .then(function (ok) { if (ok) doSave(path, text, exists); });
        return;
      }
      doSave(path, text, exists);
    }

    function doSave(path, text, exists) {
      var m = cm.value.trim() || ((exists ? 'อัพเดต ' : 'เพิ่ม ') + path);
      var ex = S.files.filter(function (x) { return x.path === path; })[0];
      var body = { message: m, content: toB64(text), branch: S.branch };
      if (ex) body.sha = ex.sha;
      go.disabled = true; status.className = 'hint'; status.textContent = 'กำลังบันทึก…';
      serial(function () { return api('/repos/' + S.repo + '/contents/' + enc(path), { method: 'PUT', body: body }); })
        .then(function (res) {
          applyUpload(path, res, m);
          if (good.checked) mutate(setStable(res.commit.sha, true));
          close(); renderList();
          if (!visible().some(function (x) { return x.path === path; })) toast('บันทึกแล้ว แต่ไฟล์ชนิดนี้ถูกซ่อนอยู่ กด "แสดงทุกไฟล์" เพื่อดู', 3500);
          else toast('บันทึกแล้ว ✓');
        }, function (e) { go.disabled = false; status.className = 'note err'; status.textContent = writeError(e); });
    }

    p.append(
      h('div', { class: 'name' }, isNew ? 'สร้างสคริปต์ใหม่' : 'แก้ไข / วางเวอร์ชันใหม่'),
      h('div', { class: 'hint' }, isNew
        ? 'ตั้งชื่อ วางโค้ด แล้วบันทึก (ใส่โฟลเดอร์ได้ ไม่ใส่นามสกุล = .lua)'
        : 'แก้ในกล่องได้เลย หรือกด "วางจากคลิปบอร์ด" เพื่อแทนที่ทั้งไฟล์ด้วยโค้ดใหม่ที่ก๊อบมา'),
      name, ta,
      h('div', { class: 'row' },
        h('button', { class: 'btn small', onclick: pasteClip }, 'วางจากคลิปบอร์ด'),
        h('button', { class: 'btn small', onclick: function () { if (ta.disabled) return; ta.value = ''; update(); ta.focus(); } }, 'ล้าง')),
      info, cm,
      h('label', { class: 'chk' }, good, '⭐ ตั้งเป็นเวอร์ชันเสถียร'),
      status, go,
      h('button', { class: 'btn', onclick: close }, 'ปิด'));

    if (!isNew) {
      ta.disabled = true; ta.value = 'กำลังโหลดโค้ด…';
      api('/repos/' + S.repo + '/git/blobs/' + f.sha).then(function (b) {
        var t = fromB64(b.content);
        if (/\u0000|�/.test(t)) throw new ApiError('binary');
        original = t; ta.value = t; ta.disabled = false; update();
      }).catch(function (e) {
        ta.value = '';
        status.className = 'note err';
        status.textContent = e && e.kind === 'binary' ? 'ไฟล์นี้ไม่ใช่ข้อความ แก้ในหน้านี้ไม่ได้' : 'โหลดโค้ดไม่ได้: ' + errorText(e);
        update();
      });
    }
    update();
  });
}

      c.length > 1 ? h('button', { class: 'btn small', onclick: function () { S.hopen[f.path] = !S.hopen[f.path]; rerender(); } }, S.hopen[f.path] ? 'ซ่อนประวัติ' : 'ประวัติ (' + c.length + ')') : null,
      h('button', { class: 'btn small', onclick: function () { editSheet(f); } }, 'แก้ไข'),

    notesView(f, rerender));
}

function item(f) {
  var c = f.commits || [], latest = c[0];
  var parts = f.path.split('/'); var base = parts.pop(); var dir = parts.length ? parts.join('/') + '/' : '';
  var nts = D.notes[f.path] || [];
  var tgs = D.tags[f.path] || [];
  var on = !!D.stars[f.path];
  var picked = !!S.sel[f.path];
  var open = !!S.open[f.path] && !S.selMode;
  var fresh = !!(latest && (Date.now() - new Date(latest.date)) < NEW_MS);
  var el;
  var rerender = function () { el.replaceWith(item(f)); };
  var toggle = function () { if (S.sel[f.path]) delete S.sel[f.path]; else S.sel[f.path] = true; rerender(); renderBar(); };
  var bits = [];
  if (dir) bits.push(dir);
  bits.push(latest ? ago(latest.date) : 'ยังไม่รู้วันที่แก้');
  if (S.sort === 'used' && U[f.path]) bits.push('ใช้ ' + ago(U[f.path]));
  if (nts.length) bits.push('💬 ' + nts.length);
  var lead = S.selMode
    ? h('button', {
        class: 'star chk' + (picked ? ' on' : ''), 'aria-pressed': picked ? 'true' : 'false', 'aria-label': picked ? 'เอาออกจากที่เลือก' : 'เลือกไฟล์นี้',
        onclick: toggle
      }, picked ? '☑' : '☐')
    : h('button', {
        class: 'star' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', 'aria-label': on ? 'เอาดาวออก' : 'ติดดาว',
        onclick: function () { if (!guard()) return; mutate(setStar(f.path, !on)); renderList(); }
      }, on ? '★' : '☆');
  el = h('div', { class: 'item' },
    h('div', { class: 'line' },
      lead,
      h('div', { class: 'main', 'aria-expanded': open ? 'true' : 'false', onclick: function () { if (S.selMode) { toggle(); return; } S.open[f.path] = !S.open[f.path]; rerender(); } },
        h('div', { class: 'name' }, base),
        h('div', { class: 'sub' }, fresh ? h('span', { class: 'new' }, 'ใหม่') : null, bits.join(' · '))),
      S.selMode ? null : h('button', { class: 'btn primary small', 'aria-label': 'คัดลอกบรรทัด Delta ของ ' + base, onclick: function () { markUsed(f.path); copyText(deltaLine(rawUrl(S.branch, f.path))); } }, 'คัดลอก')),
    open ? detail(f, rerender) : null);
  return el;
}

function sec(title, n) { return h('div', { class: 'sec' }, h('span', {}, title), h('span', {}, n)); }

function matches(f) {
  if (S.tag && (D.tags[f.path] || []).indexOf(S.tag) === -1) return false;
  var q = S.q.trim().toLowerCase();
  if (!q) return true;
  var c = f.commits && f.commits[0];
  var hay = [f.path, c ? c.msg : '', (D.tags[f.path] || []).join(' '), (D.notes[f.path] || []).map(function (n) { return n.text; }).join(' ')].join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}

function renderList() {
  if (!listBox) return;
  var all = visible().filter(matches).sort(cmpFor());
  var starred = all.filter(function (f) { return D.stars[f.path]; });
  var rest = all.filter(function (f) { return !D.stars[f.path]; });
  var kids = [];
  if (S.limit) kids.push(note('GitHub จำกัดจำนวนครั้งที่เช็กต่อชั่วโมง บางไฟล์ยังไม่รู้วันที่ (อยู่ล่างสุด)' + (S.limit.reset ? ' กดรีเฟรชอีกครั้งหลัง ' + TIME.format(new Date(S.limit.reset)) : ''), 'warn'));
  if (S.truncated) kids.push(note('repo ใหญ่มาก GitHub ส่งรายชื่อไฟล์มาไม่ครบ', 'warn'));
  if (!all.length) kids.push(note(S.q.trim() ? 'ไม่เจอไฟล์ที่ตรงกับ "' + S.q.trim() + '"' : S.tag ? 'ยังไม่มีไฟล์ในแท็ก #' + S.tag : 'ยังไม่เจอไฟล์สคริปต์ (.lua) ใน repo นี้ ลองเปิด ⋯ › แสดงทุกไฟล์ หรือกด + เพื่ออัพไฟล์'));
  if (starred.length) kids.push(sec('⭐ ติดดาว', starred.length), h('div', { class: 'list' }, starred.map(function (f) { return item(f); })));
  if (rest.length) {
    var cap = S.q.trim() ? rest.length : S.shown;
    kids.push(sec(starred.length ? 'ไฟล์อื่น' : 'ไฟล์ทั้งหมด', rest.length), h('div', { class: 'list' }, rest.slice(0, cap).map(function (f) { return item(f); })));
    if (rest.length > cap) kids.push(h('button', { class: 'btn more', onclick: function () { S.shown += PAGE; renderList(); } }, 'แสดงเพิ่ม (เหลืออีก ' + (rest.length - cap) + ')'));
  }
  listBox.replaceChildren.apply(listBox, kids);
  renderTags(); renderBar();
}

/* ---------- เรียง / ใช้ล่าสุด / เลือกหลายไฟล์ ---------- */
function nameCmp(a, b) { return a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: 'base' }); }
function usedCmp(a, b) {
  var ua = U[a.path] || '', ub = U[b.path] || '';
  if (ua === ub) return byDate(a, b);
  return ua < ub ? 1 : -1;
}
function cmpFor() { return S.sort === 'name' ? nameCmp : S.sort === 'used' ? usedCmp : byDate; }
function markUsed(path) { U[path] = new Date().toISOString(); store.set('u:' + S.repo, U); }
function selected() { return S.files.filter(function (f) { return S.sel[f.path]; }); }

function renderTags() {
  var count = {}, all = {};
  visible().forEach(function (f) { (D.tags[f.path] || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; }); });
  Object.keys(D.tags).forEach(function (p) { (D.tags[p] || []).forEach(function (t) { all[t] = 1; }); });
  if (tagList) tagList.replaceChildren.apply(tagList, Object.keys(all).sort().map(function (t) { return h('option', { value: t }); }));
  if (S.tag && !count[S.tag]) S.tag = '';
  if (!tagBox) return;
  var names = Object.keys(count).sort(function (a, b) { return count[b] - count[a] || a.localeCompare(b); });
  var kids = [];
  if (names.length) {
    kids.push(h('button', { class: 'pill' + (S.tag ? '' : ' on'), onclick: function () { S.tag = ''; S.shown = PAGE; renderList(); } }, 'ทั้งหมด'));
    names.forEach(function (t) {
      kids.push(h('button', { class: 'pill tgp' + (S.tag === t ? ' on' : ''), style: '--h:' + hue(t),
        onclick: function () { S.tag = S.tag === t ? '' : t; S.shown = PAGE; renderList(); } }, '#' + t + ' ' + count[t]));
    });
  }
  tagBox.replaceChildren.apply(tagBox, kids);
}

function renderTools() { if (toolsBox) toolsBox.replaceChildren(); }

function menuSheet() {
  openSheet(function (p, close) {
    var go = function (fn) { return function () { close(); fn(); }; };
    var sortBtn = function (v, label) {
      return h('button', { class: 'btn' + (S.sort === v ? ' on' : ''), onclick: function () { S.sort = v; store.set('sort', v); S.shown = PAGE; close(); renderList(); } }, label);
    };
    p.append(
      h('div', { class: 'hint' }, 'เรียงตาม'),
      h('div', { class: 'sort' }, sortBtn('date', 'ล่าสุด'), sortBtn('name', 'ชื่อ'), sortBtn('used', 'ใช้ล่าสุด')),
      h('button', { class: 'btn', onclick: go(function () { editSheet(null); }) }, '✎ สร้างสคริปต์'),
      h('button', { class: 'btn', onclick: go(function () { S.selMode = true; renderTools(); renderList(); }) }, 'เลือกหลายไฟล์'),
      h('button', { class: 'btn', onclick: go(function () { copyText(newPrompt()); }) }, 'Prompt สคริปต์ใหม่'),
      h('button', { class: 'btn', onclick: go(function () { store.del('c:' + S.repo); loadAll(); }) }, 'รีเฟรชรายการ'),

function bulkDelete() {
  var list = selected();
  if (!list.length || !guard()) return;
  ask('ลบ ' + list.length + ' ไฟล์ ?',
    'ไฟล์จะย้ายไปถังขยะ กู้คืนได้ที่ เพิ่มเติม › ถังขยะ บรรทัด Delta ที่ชี้ไปไฟล์เหล่านี้จะโหลดไม่ได้จนกว่าจะกู้คืน ยกเว้นบรรทัดแบบล็อกเวอร์ชัน',
    'ลบเลย', true).then(function (ok) {

    var i = 0, fail = null;
    var finish = function () {
      if (fail) toast('ลบได้ ' + i + '/' + list.length + ' ไฟล์ · ' + writeError(fail), 4500);
      else { S.selMode = false; toast('ลบแล้ว ' + i + ' ไฟล์ ✓ กู้คืนได้ในถังขยะ', 2600); }

      toast('กำลังลบ ' + (i + 1) + '/' + list.length + '…', 20000);
      removeFile(list[i]).then(function () { i++; next(); }, function (e) { fail = e; finish(); });

/* ---------- ถังขยะ / สำรองข้อมูล / เมนูเพิ่มเติม ---------- */
function restoreTrash(e) {
  if (!guard()) return Promise.resolve(false);
  return api('/repos/' + S.repo + '/git/blobs/' + e.sha).then(function (b) {
    var ex = S.files.filter(function (x) { return x.path === e.path; })[0];
    var msg = 'กู้คืน ' + e.path;
    var body = { message: msg, content: String(b.content).replace(/\s/g, ''), branch: S.branch };
    if (ex) body.sha = ex.sha;
    return serial(function () { return api('/repos/' + S.repo + '/contents/' + enc(e.path), { method: 'PUT', body: body }); })
      .then(function (res) { applyUpload(e.path, res, msg); });
  }).then(function () {
    var f = S.files.filter(function (x) { return x.path === e.path; })[0];
    if (f) f.commits = null;
    mutate(untrash(e));
    fill().then(renderList);
    return true;
  });
}

function exportData() {

function tokenSheet() {
  openSheet(function (p, close) {

      api('/repos/' + S.repo, { token: t }).then(function (meta) {

      }).catch(function (e) {

    p.append(
      h('div', { class: 'name' }, 'ตั้ง token GitHub'),

      h('ol', { class: 'steps' },
        h('li', {}, 'เปิด ', h('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener' }, 'github.com/settings/personal-access-tokens/new')),
        h('li', {}, 'ตั้งชื่ออะไรก็ได้ เลือกวันหมดอายุให้นานตามที่สบายใจ'),
        h('li', {}, 'Repository access เลือก Only select repositories แล้วเลือก repo ของ Script Hub นี้ repo เดียว'),
        h('li', {}, 'Permissions > Repository permissions > Contents ตั้งเป็น Read and write'),
        h('li', {}, 'กด Generate token แล้วคัดลอกมาวางด้านล่าง')),

/* ---------- อัพไฟล์ ---------- */
function cleanDir(s) { return (s || '').split('/').map(function (x) { return x.trim(); }).filter(Boolean).join('/'); }
function fileExists(path) { return S.files.some(function (f) { return f.path === path; }); }

function uploadSheet() {
  if (!guard()) return;
  openSheet(function (p, close) {
    var picked = [];
    var dirs = {};
    S.files.forEach(function (f) { var d = f.path.split('/').slice(0, -1).join('/'); if (d && d.charAt(0) !== '.') dirs[d] = 1; });
    var folder = h('input', { type: 'text', list: 'hub-dirs', placeholder: 'โฟลเดอร์ปลายทาง (เว้นว่าง = หน้าแรกของ repo)', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', oninput: draw });
    var cm = h('input', { type: 'text', placeholder: 'ข้อความ commit (เว้นว่างก็ได้)', autocomplete: 'off' });
    var box = h('div', {});
    var status = h('div', { class: 'hint' });
    var fileIn = h('input', { type: 'file', multiple: true, class: 'vh', onchange: function () {
      picked = picked.concat([].slice.call(fileIn.files)); fileIn.value = ''; draw();
    } });
    var go = h('button', { class: 'btn primary', onclick: run }, 'อัพขึ้น GitHub');

    function draw() {
      var d = cleanDir(folder.value);
      box.replaceChildren.apply(box, picked.map(function (file, i) {
        var path = (d ? d + '/' : '') + file.name;
        var ex = fileExists(path);
        return h('div', { class: 'pick' },
          h('div', { class: 'info' }, path, h('span', { class: 'badge' + (ex ? ' warn' : '') }, ex ? 'ทับของเดิม' : 'ไฟล์ใหม่'), h('div', { class: 'sz' }, fmtSize(file.size))),
          h('button', { class: 'btn small', onclick: function () { picked.splice(i, 1); draw(); } }, 'เอาออก'));
      }));
      go.disabled = !picked.length;
    }

    function run() {
      var d = cleanDir(folder.value);
      if (/(^|\/)\.\.?(\/|$)/.test(d)) { toast('ชื่อโฟลเดอร์ไม่ถูกต้อง'); return; }
      var byPath = {}, jobs = [];
      picked.forEach(function (file) { byPath[(d ? d + '/' : '') + file.name] = file; });
      Object.keys(byPath).forEach(function (path) { jobs.push({ path: path, file: byPath[path] }); });
      if (jobs.some(function (j) { return j.path === 'index.html'; })) { toast('ไม่อนุญาตให้ทับ index.html (ตัวหน้านี้) จากในหน้านี้', 3000); return; }
      var big = jobs.filter(function (j) { return j.file.size > MAX_BYTES; })[0];
      if (big) { toast(big.file.name + ' ใหญ่เกิน ' + fmtSize(MAX_BYTES), 3000); return; }

      go.disabled = true; status.className = 'hint';
      var done = [], fail = null, failPath = '';
      var chain = Promise.resolve();
      jobs.forEach(function (j) {
        chain = chain.then(function () {
          if (fail) return;
          status.textContent = 'กำลังอัพ ' + (done.length + 1) + '/' + jobs.length + ' · ' + j.path;
          var m = cm.value.trim() || ((fileExists(j.path) ? 'อัพเดต ' : 'เพิ่ม ') + j.path);
          return uploadOne(j.path, j.file, m).then(function () { done.push(j.path); }, function (e) { fail = e; failPath = j.path; });
        });
      });
      chain.then(function () {
        renderList();
        fill().then(renderList);
        if (fail) {
          picked = picked.filter(function (file) { return done.indexOf((d ? d + '/' : '') + file.name) === -1; });
          draw();
          status.className = 'note err';
          status.textContent = 'อัพได้ ' + done.length + '/' + jobs.length + ' ไฟล์ · ติดที่ ' + failPath + ': ' + writeError(fail);
          return;
        }
        close();
        var hid = done.filter(function (path) { return !visible().some(function (f) { return f.path === path; }); });
        if (hid.length) toast('อัพแล้ว แต่ไฟล์ชนิดนี้ถูกซ่อนอยู่ กด "แสดงทุกไฟล์" เพื่อดู', 3500);
        else toast('อัพแล้ว ' + done.length + ' ไฟล์ ✓');
      });
    }

    p.append(
      h('div', { class: 'name' }, 'อัพไฟล์ขึ้น GitHub'),
      h('label', { class: 'btn' }, 'เลือกไฟล์จากเครื่อง', fileIn),
      box,
      folder,
      h('datalist', { id: 'hub-dirs' }, Object.keys(dirs).sort().map(function (x) { return h('option', { value: x }); })),
      cm,
      h('div', { class: 'hint' }, 'ชื่อซ้ำกับไฟล์เดิม = เป็นเวอร์ชันใหม่ของไฟล์นั้น ประวัติเก่ายังอยู่ ถ้าเวอร์ชันนี้ทดสอบแล้วใช้ได้ พิมพ์คำว่า stable ในข้อความ จะขึ้น ⭐ เสถียร'),
      status, go,
      h('button', { class: 'btn', onclick: close }, 'ปิด'));
    draw();
  });
}

      h('div', { class: 'row' }, h('button', { class: 'btn small primary', onclick: tokenSheet }, 'ตั้ง token ใหม่'))));

  toolsBox = h('div', { class: 'tools' });
  tagBox = h('div', { class: 'tagbar' });
  tagList = h('datalist', { id: 'hub-tags' });
  barBox = h('div', {});
  listBox = h('div', {});
  app.replaceChildren(top, toolsBox, tagBox, listBox, help(), tagList, barBox);
  var lb = listBox; lb.classList.add('enter');
  renderTools(); renderList();
  setTimeout(function () { lb.classList.remove('enter'); }, 1000);
}

function render() {
  if (S.repo) { repoBtn.hidden = false; repoBtn.textContent = S.repo + ' ▾'; } else repoBtn.hidden = true;
  listBox = null; tagBox = null; toolsBox = null; barBox = null; tagList = null;
  document.body.classList.remove('sel');
  renderStatus();

  if (S.phase === 'form') { app.replaceChildren(formView()); return; }
  if (S.phase === 'loading') { app.replaceChildren(note('กำลังโหลดสคริปต์จาก GitHub…'), h('div', { class: 'hint', id: 'prog' }, S.progress)); return; }
  if (S.phase === 'error') {
    if (S.error && S.error.kind === 'notfound') { app.replaceChildren(formView(errorText(S.error))); return; }
    app.replaceChildren(note(errorText(S.error), 'err'), h('button', { class: 'btn primary', onclick: loadAll }, 'ลองใหม่'));
    return;
  }
  buildReady();
}

repoBtn.addEventListener('click', function () { S.phase = 'form'; render(); });
cfgBtn.addEventListener('click', tokenSheet);

/* ---------- start ---------- */
S.repo = detectRepo();
if (S.repo) { store.set('repo', S.repo); initData(); loadAll(); } else render();
})();
</script>
</body>
</html>
