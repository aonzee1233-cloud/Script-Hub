<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Hub</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mute:#667085; --line:#e3e6eb;
  --accent:#2f6df6; --accent-ink:#fff; --good:#12805c; --warn:#b4540a; --bad:#c0362c; --chip:#eef1f6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#171a21;--ink:#e9ecf1;--mute:#8d96a5;--line:#262b35;--accent:#6b9bff;--accent-ink:#0b1020;--good:#3ecf9c;--warn:#f0a15a;--bad:#ff7b70;--chip:#1f232c}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:12px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.name{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.dir{color:var(--mute);font-weight:400}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.msg{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 2px}
.ver{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ver:last-child{border-bottom:0}
.ver .info{flex:1;min-width:0}
.ver .t{font-size:13px;color:var(--mute)}
.ver .m{font-size:15px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--good);margin-left:6px}
.sha{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);color:var(--mute);font-size:14px;margin-bottom:12px;overflow-wrap:anywhere}
.note.err{color:var(--bad)} .note.warn{color:var(--warn)}
.form{display:grid;gap:10px}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px}
details{margin-top:18px;color:var(--mute);font-size:14px}
summary{cursor:pointer;min-height:36px}
details ol{padding-left:20px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:10px}
.sheet textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Script Hub</h1>
    <button id="repoBtn" class="chip" hidden></button>
  </header>
  <div id="app"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
var store = {
  get: function (k) { try { return JSON.parse(localStorage.getItem('hub:' + k)); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem('hub:' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('hub:' + k); } catch (e) {} }
};

function h(tag, props) {
  var el = document.createElement(tag);
  var p = props || {};
  Object.keys(p).forEach(function (k) {
    var v = p[k];
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  });
  var kids = [].concat.apply([], [].slice.call(arguments, 2));
  kids.forEach(function (kid) {
    if (kid == null || kid === false) return;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return el;
}

var enc = function (path) { return path.split('/').map(encodeURIComponent).join('/'); };
var rawUrl = function (ref, path) { return 'https://raw.githubusercontent.com/' + S.repo + '/' + encodeURIComponent(ref) + '/' + enc(path); };
var deltaLine = function (url) { return 'loadstring(game:HttpGet("' + url + '"))()'; };
var isGood = function (m) { return /stable|เสถียร|✅|⭐/i.test(m || ''); };

var DATE = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
var TIME = new Intl.DateTimeFormat('th-TH', { hour: '2-digit', minute: '2-digit' });
function when(iso) { return DATE.format(new Date(iso)); }
function ago(iso) {
  var s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return 'เมื่อกี้';
  var m = s / 60; if (m < 60) return Math.round(m) + ' นาทีก่อน';
  var hr = m / 60; if (hr < 24) return Math.round(hr) + ' ชม.ก่อน';
  var d = hr / 24; if (d < 30) return Math.round(d) + ' วันก่อน';
  var mo = d / 30; if (mo < 12) return Math.round(mo) + ' เดือนก่อน';
  return Math.round(d / 365) + ' ปีก่อน';
}

/* ---------- state ---------- */
var S = { repo: null, branch: null, files: [], showAll: false, open: {}, phase: 'form', error: null, limit: null, progress: '', truncated: false };
var app = document.getElementById('app');
var repoBtn = document.getElementById('repoBtn');

function parseRepo(text) {
  var t = (text || '').trim()
    .replace(/^https?:\/\//i, '')
    .replace(/^(www\.)?(raw\.githubusercontent\.com|github\.com)\//i, '')
    .replace(/\.git$/, '');
  var parts = t.split(/[\/?#]/).filter(Boolean);
  return parts.length >= 2 ? parts[0] + '/' + parts[1] : null;
}

function detectRepo() {
  var q = parseRepo(new URLSearchParams(location.search).get('repo'));
  if (q) return q;
  var hs = parseRepo(location.hash.replace('#', ''));
  if (hs) return hs;
  if (/\.github\.io$/i.test(location.hostname)) {
    var owner = location.hostname.split('.')[0];
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg && !/\.html?$/i.test(seg)) return owner + '/' + seg;
  }
  return store.get('repo');
}

/* ---------- GitHub API ---------- */
function ApiError(kind, extra) { this.kind = kind; for (var k in (extra || {})) this[k] = extra[k]; }

function api(path) {
  return fetch('https://api.github.com' + path, { headers: { 'Accept': 'application/vnd.github+json' } })
    .catch(function () { throw new ApiError('network'); })
    .then(function (r) {
      if (r.ok) return r.json();
      if (r.status === 404) throw new ApiError('notfound');
      if (r.status === 403 || r.status === 429) {
        var rem = r.headers.get('x-ratelimit-remaining');
        var reset = Number(r.headers.get('x-ratelimit-reset')) * 1000;
        if (rem === '0' || r.status === 429) throw new ApiError('limit', { reset: reset || null });
      }
      throw new ApiError('http', { status: r.status });
    });
}

function visible() {
  return S.files.filter(function (f) {
    if (f.path === 'index.html') return false;
    if (f.path.split('/').some(function (s) { return s.charAt(0) === '.'; })) return false;
    return S.showAll || /\.(lua|luau|txt)$/i.test(f.path);
  });
}

function loadAll() {
  S.phase = 'loading'; S.error = null; S.limit = null; S.progress = ''; render();
  api('/repos/' + S.repo)
    .then(function (meta) {
      S.branch = meta.default_branch;
      return api('/repos/' + S.repo + '/git/trees/' + encodeURIComponent(S.branch) + '?recursive=1');
    })
    .then(function (tree) {
      S.truncated = !!tree.truncated;
      var cache = store.get('c:' + S.repo) || {};
      S.files = tree.tree.filter(function (t) { return t.type === 'blob'; }).map(function (t) {
        var c = cache[t.path];
        return { path: t.path, sha: t.sha, commits: c && c.sha === t.sha ? c.commits : null };
      });
      return fill();
    })
    .then(function () { S.phase = 'ready'; render(); })
    .catch(function (e) { S.phase = 'error'; S.error = e; render(); });
}

function fill() {
  var todo = visible().filter(function (f) { return !f.commits; });
  var i = 0, done = 0;
  var cache = store.get('c:' + S.repo) || {};
  function tick() {
    S.progress = todo.length ? 'เช็กวันที่แก้ไข ' + done + '/' + todo.length : '';
    var el = document.getElementById('prog'); if (el) el.textContent = S.progress;
  }
  tick();
  function worker() {
    if (i >= todo.length || S.limit) return Promise.resolve();
    var f = todo[i++];
    return api('/repos/' + S.repo + '/commits?sha=' + encodeURIComponent(S.branch) + '&path=' + encodeURIComponent(f.path) + '&per_page=15')
      .then(function (arr) {
        f.commits = arr.map(function (c) {
          var who = c.commit.committer || c.commit.author;
          return { sha: c.sha, date: who.date, msg: (c.commit.message || '').split('\n')[0] };
        });
        cache[f.path] = { sha: f.sha, commits: f.commits };
      })
      .catch(function (e) { if (e.kind === 'limit') S.limit = e; })
      .then(function () { done++; tick(); return worker(); });
  }
  return Promise.all([worker(), worker(), worker(), worker()]).then(function () {
    var keep = {};
    S.files.forEach(function (f) { if (cache[f.path]) keep[f.path] = cache[f.path]; });
    store.set('c:' + S.repo, keep);
  });
}

/* ---------- copy ---------- */
var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1600);
}

function showSheet(text) {
  var ta = h('textarea', { readonly: true }); ta.value = text;
  var sheet = h('div', { class: 'sheet', onclick: function (e) { if (e.target === sheet) sheet.remove(); } },
    h('div', {},
      h('div', { class: 'hint' }, 'คัดลอกอัตโนมัติไม่ได้ กดค้างที่กล่องแล้วเลือก Copy เอง'),
      ta,
      h('button', { class: 'btn', onclick: function () { sheet.remove(); } }, 'ปิด')));
  document.body.append(sheet);
  ta.focus(); ta.select();
}

function copyText(text) {
  var fallback = function () {
    try {
      var ta = h('textarea', { readonly: true }); ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.append(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy'); ta.remove();
      if (ok) { toast('คัดลอกแล้ว ✓'); return; }
    } catch (e) {}
    showSheet(text);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('คัดลอกแล้ว ✓'); }, fallback);
  } else fallback();
}

/* ---------- prompts for Claude ---------- */
function rules(existing) {
  return 'กติกา:\n' +
    '- ส่งไฟล์เต็มที่รันได้เลย ไม่ใช่เศษโค้ด' + (existing ? ' และใช้ชื่อไฟล์เดิม' : '') + '\n' +
    '- ใส่คอมเมนต์หัวไฟล์: ชื่อ / เวอร์ชัน / วันที่ / ทำอะไร / รอบนี้เปลี่ยนอะไร\n' +
    '- ตอนเริ่มรัน ให้ print("[ชื่อ vX.Y]") หนึ่งครั้ง จะได้รู้ว่ารันเวอร์ชันไหน\n' +
    '- ตอบท้ายด้วยข้อความ 1 บรรทัดสั้นๆ สำหรับใช้เป็น commit message ตอนอัพขึ้น GitHub';
}
function newPrompt() { return 'ผมอยากได้สคริปต์ Lua ใหม่\n\n' + rules(false) + '\n\nสิ่งที่อยากได้:\n'; }
function claudePrompt(f) {
  var ref = f.commits && f.commits[0] ? f.commits[0].sha : S.branch;
  return 'ผมเก็บสคริปต์ Lua ไว้ใน GitHub repo ' + S.repo + '\n' +
    'ไฟล์ที่จะทำต่อ: ' + f.path + '\n' +
    'อ่านโค้ดล่าสุดจากลิงก์นี้ก่อน: ' + rawUrl(ref, f.path) + '\n\n' +
    rules(true) + '\n\nสิ่งที่อยากให้ทำรอบนี้:\n';
}

/* ---------- views ---------- */
function note(text, cls) { return h('div', { class: 'note ' + (cls || '') }, text); }

function formView(msg) {
  var input = h('input', { type: 'text', placeholder: 'ชื่อ/repo เช่น somchai/my-scripts หรือวางลิงก์ GitHub', value: S.repo || '', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  var go = function () {
    var r = parseRepo(input.value);
    if (!r) { toast('ใส่ให้ครบ: ชื่อผู้ใช้/ชื่อ repo'); return; }
    S.repo = r; store.set('repo', r); S.files = []; S.open = {}; loadAll();
  };
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  return h('div', { class: 'form' },
    msg ? note(msg, 'err') : null,
    note('ใส่ชื่อ repo GitHub ที่เก็บสคริปต์ (ต้องเป็น Public) ใส่ครั้งเดียว เครื่องนี้จะจำไว้'),
    input,
    h('button', { class: 'btn primary', onclick: go }, 'เปิด'));
}

function errorText(e) {
  if (!e) return 'เกิดข้อผิดพลาด';
  if (e.kind === 'notfound') return 'หา repo ' + S.repo + ' ไม่เจอ ตรวจชื่ออีกครั้ง และ repo ต้องเป็น Public (ไม่งั้นลิงก์ raw ก็โหลดใน Delta ไม่ได้)';
  if (e.kind === 'limit') return 'GitHub จำกัดจำนวนครั้งที่เช็กต่อชั่วโมง' + (e.reset ? ' ลองใหม่หลัง ' + TIME.format(new Date(e.reset)) : ' รอสักพักแล้วลองใหม่');
  if (e.kind === 'network') return 'ต่อ GitHub ไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่';
  return 'GitHub ตอบกลับผิดปกติ (รหัส ' + (e.status || '?') + ')';
}

function byDate(a, b) {
  var da = a.commits && a.commits[0] ? a.commits[0].date : '';
  var db = b.commits && b.commits[0] ? b.commits[0].date : '';
  if (da === db) return a.path.localeCompare(b.path);
  return da < db ? 1 : -1;
}

function hist(f) {
  return h('div', { class: 'hist' },
    h('div', { class: 'hint' }, 'ปุ่ม "คัดลอก" ให้บรรทัดแบบล็อกเวอร์ชัน เนื้อหาไม่เปลี่ยนแม้จะอัพไฟล์ทับทีหลัง ใช้ย้อนกลับไปเวอร์ชันที่เสถียรได้'),
    f.commits.map(function (c, i) {
      return h('div', { class: 'ver' },
        h('div', { class: 'info' },
          h('div', { class: 't' }, when(c.date) + ' · ' + ago(c.date) + ' · ', h('span', { class: 'sha' }, c.sha.slice(0, 7)),
            i === 0 ? h('span', { class: 'badge' }, 'ล่าสุด') : null,
            isGood(c.msg) ? h('span', { class: 'badge' }, '⭐ เสถียร') : null),
          h('div', { class: 'm' }, c.msg || '(ไม่มีข้อความ)')),
        h('button', { class: 'btn small', onclick: function () { copyText(deltaLine(rawUrl(c.sha, f.path))); } }, 'คัดลอก'));
    }));
}

function card(f) {
  var c = f.commits || [];
  var latest = c[0];
  var parts = f.path.split('/'); var base = parts.pop(); var dir = parts.length ? parts.join('/') + '/' : '';
  var el = h('section', { class: 'card' },
    h('div', { class: 'name' }, dir ? h('span', { class: 'dir' }, dir) : null, base),
    h('div', { class: 'meta' }, latest ? 'แก้ล่าสุด ' + ago(latest.date) + ' · ' + when(latest.date) : 'ยังไม่รู้วันที่แก้'),
    latest ? h('div', { class: 'msg' }, latest.msg) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn primary small', onclick: function () { copyText(deltaLine(rawUrl(S.branch, f.path))); } }, 'คัดลอกบรรทัด Delta'),
      c.length > 1 ? h('button', { class: 'btn small', onclick: function () { S.open[f.path] = !S.open[f.path]; el.replaceWith(card(f)); } }, S.open[f.path] ? 'ซ่อนประวัติ' : 'ประวัติ (' + c.length + ')') : null,
      h('button', { class: 'btn small', onclick: function () { copyText(claudePrompt(f)); } }, 'Prompt ให้ Claude')),
    S.open[f.path] && c.length ? hist(f) : null);
  return el;
}

function help() {
  return h('details', {},
    h('summary', {}, 'วิธีใช้'),
    h('ol', {},
      h('li', {}, 'กด "คัดลอกบรรทัด Delta" แล้ววางใน Delta บนแท็บเล็ต เซฟไว้ แก้สคริปต์ทีหลังก็รันบรรทัดเดิมได้ (อัพใหม่แล้วอาจต้องรอ ~5 นาที)'),
      h('li', {}, 'อยากได้ผลทันทีหรือย้อนเวอร์ชัน เปิด "ประวัติ" แล้วคัดลอกบรรทัดของเวอร์ชันนั้น'),
      h('li', {}, 'ตอนอัพขึ้น GitHub ใส่ข้อความ commit สั้นๆ ถ้าเวอร์ชันนั้นทดสอบแล้วใช้ได้ ให้พิมพ์คำว่า stable ในข้อความ จะขึ้นดาว ⭐'),
      h('li', {}, '"Prompt ให้ Claude" ใช้ต่อสคริปต์ในแชทใหม่ข้ามเครื่อง ไม่ต้องส่งเมล')));
}

function render() {
  if (S.repo) { repoBtn.hidden = false; repoBtn.textContent = S.repo + ' ▾'; } else repoBtn.hidden = true;

  if (S.phase === 'form') { app.replaceChildren(formView()); return; }
  if (S.phase === 'loading') { app.replaceChildren(note('กำลังโหลดสคริปต์จาก GitHub…'), h('div', { class: 'hint', id: 'prog' }, S.progress)); return; }
  if (S.phase === 'error') {
    if (S.error && S.error.kind === 'notfound') { app.replaceChildren(formView(errorText(S.error))); return; }
    app.replaceChildren(note(errorText(S.error), 'err'), h('button', { class: 'btn primary', onclick: loadAll }, 'ลองใหม่'));
    return;
  }

  var list = visible().slice().sort(byDate);
  var box = h('div', {});
  box.append(h('div', { class: 'bar' },
    h('button', { class: 'btn primary', onclick: function () { copyText(newPrompt()); } }, 'Prompt สคริปต์ใหม่'),
    h('button', { class: 'btn', onclick: function () { store.del('c:' + S.repo); loadAll(); } }, 'รีเฟรช'),
    h('button', { class: 'btn', onclick: function () { S.showAll = !S.showAll; S.phase = 'loading'; render(); fill().then(function () { S.phase = 'ready'; render(); }); } }, S.showAll ? 'ซ่อนไฟล์อื่น' : 'แสดงทุกไฟล์')));
  if (S.limit) box.append(note('GitHub จำกัดจำนวนครั้งที่เช็กต่อชั่วโมง บางไฟล์ยังไม่รู้วันที่ (อยู่ล่างสุด)' + (S.limit.reset ? ' กดรีเฟรชอีกครั้งหลัง ' + TIME.format(new Date(S.limit.reset)) : ''), 'warn'));
  if (S.truncated) box.append(note('repo ใหญ่มาก GitHub ส่งรายชื่อไฟล์มาไม่ครบ', 'warn'));
  if (!list.length) box.append(note('ยังไม่เจอไฟล์สคริปต์ (.lua) ใน repo นี้ ลอง "แสดงทุกไฟล์"'));
  list.forEach(function (f) { box.append(card(f)); });
  box.append(help());
  app.replaceChildren(box);
}

repoBtn.addEventListener('click', function () { S.phase = 'form'; render(); });

/* ---------- start ---------- */
S.repo = detectRepo();
if (S.repo) { store.set('repo', S.repo); loadAll(); } else render();
})();
</script>
